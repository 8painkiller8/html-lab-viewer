<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Lab Viewer</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;color:#173247;background:#f3f6f8}body{display:flex;flex-direction:column}
header{display:grid;gap:6px;padding:8px 12px;border-bottom:1px solid #cad5dd;background:white}
.row{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
.sep{width:1px;align-self:stretch;background:#cad5dd;margin:2px 3px}
button,select{font:inherit;font-size:13px;padding:5px 9px;border:1px solid #a9bac6;border-radius:5px;background:white;color:inherit;cursor:pointer}
button.primary{background:#174d70;color:white;border-color:#174d70}
button:focus-visible,select:focus-visible{outline:3px solid #e49c24;outline-offset:2px}
button[aria-pressed="true"]{background:#dceefa;border-color:#174d70}
#filename{font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:220px}
#zoom{font-size:13px;min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.label{font-size:12px;color:#5a7183}
#status{margin:0;padding:5px 12px;font-size:12px;background:#e9f0f5}
#show{display:none;position:fixed;right:6px;bottom:6px;z-index:10;font-size:12px;padding:3px 8px;opacity:.55}#show:hover,#show:focus-visible{opacity:1}
body.clean header,body.clean #status{display:none}body.clean #show{display:block}[hidden]{display:none!important}
@media (max-width:620px){header{padding:6px 8px;gap:5px}.row{gap:5px}button,select{font-size:12px;padding:4px 7px}.label,.sep{display:none}#filename{max-width:110px}}
#viewport{flex:1;min-height:0;overflow:auto;position:relative}#surface{position:relative;margin:auto}
iframe{position:absolute;left:0;top:0;border:0;background:white;transform-origin:0 0;max-width:none}
</style>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" async></script>
</head>
<body>
<header>
<div class="row">
<button id="choose" class="primary" type="button">Choose HTML file…</button>
<input id="file" type="file" accept=".html,.htm,text/html" hidden>
<span id="filename">No file selected</span>
<button id="reset" type="button">Clear file</button>
<button id="save" type="button">Save in presentation</button>
</div>
<div class="row">
<button id="fill" type="button" aria-pressed="true" title="Page fills the box at the chosen page width; the page scrolls inside if it is taller">Fill window</button>
<button id="fit" type="button" aria-pressed="false" title="Shrink the whole page to fit the box">Whole page</button>
<span class="sep"></span>
<button id="out" aria-label="Smaller" type="button">−</button><span id="zoom">100%</span><button id="in" aria-label="Larger" type="button">+</button>
<label class="label" for="width">Page width</label>
<select id="width"><option value="960">960 px</option><option value="1120">1120 px</option><option value="1280" selected>1280 px</option><option value="1440">1440 px</option><option value="1600">1600 px</option><option value="1920">1920 px</option></select>
<span class="sep"></span>
<button id="hide" type="button">Hide controls</button>
</div>
</header>
<p id="status" role="status" aria-live="polite">Choose a self-contained HTML file. External libraries may need internet.</p>
<button id="show" type="button">Show controls</button>
<div id="viewport"><div id="surface"><iframe id="viewer" title="Interactive HTML lab" sandbox="allow-scripts allow-downloads" allow="fullscreen"></iframe></div></div>
<script src="viewer.js"></script>
</body>
</html>
